<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c416a">
<title>수협 차량 운행기록</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css?v=3">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./app.js?v=3"></script>
</head>
<body>
<header><div class="top"><div class="brand"><img src="./vehicles/symbol.webp" alt="수협"><div><small>수협 차량관리</small><h1>차량 운행기록</h1></div></div><button id="settings" class="outline">설정</button></div></header>
<main>
<section class="panel setup" aria-labelledby="vehicleTitle">
<h2 id="vehicleTitle">차량 선택</h2>
<div id="vehicles" class="vehicles"></div>
</section>
<section class="panel ride" aria-labelledby="driveTitle">
<div class="row"><h2 id="driveTitle">운행 현황</h2><span class="badge">실제 GPS</span></div>
<div class="ride-summary">
<img id="truck" src="./vehicles/cold-01.webp?v=2" alt="선택한 차량">
<div><span id="state" class="status">운행 대기</span><div id="metrics">00:00 · 0.00 km</div><small id="freshness">운행을 시작하면 지도에 위치가 표시됩니다.</small></div>
</div>
<div id="mapWaiting" class="map-waiting">운행을 시작하면 현재 위치를 표시합니다.</div>
<div id="map" aria-label="운행 경로 지도" hidden></div>
<div id="mapNote" class="muted" hidden></div>
<div class="row controls"><button id="action" class="primary">운행 시작</button></div>
<p id="message" role="status" aria-live="polite"></p>
</section>
<section class="panel" aria-labelledby="logTitle"><h2 id="logTitle">운행일지</h2><ul id="records"></ul></section>
</main>
<dialog id="mapSettings">
<form id="mapForm">
<h2>설정</h2>
<p>카카오 JavaScript 키를 이 기기의 브라우저에 저장합니다.</p>
<label for="mapKey">카카오 JavaScript 키</label>
<input id="mapKey" type="password" autocomplete="off" spellcheck="false" placeholder="카카오 키 붙여넣기">
<small>입력란을 비워 저장하면 OpenStreetMap을 사용합니다.</small>
<details id="serverSettings"><summary>서버 기록 연결</summary>
<label for="code">개인 기록 접근 코드</label>
<input id="code" type="password" autocomplete="off" spellcheck="false" placeholder="선택 입력">
<small>이전 서버 기록을 조회하거나 새 기록을 서버에도 저장할 때 사용합니다. 운행과 기기 저장은 코드 없이 가능합니다.</small>
</details>
<p id="settingsError" role="alert"></p>
<div class="row"><button type="button" id="cancel" class="outline">닫기</button><button class="primary">저장</button></div>
</form>
</dialog>
</body>
</html>
