<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c416a">
<title>수협 차량운행 시연</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<header><div class="top"><div class="brand"><img src="./vehicles/symbol.webp" alt="수협"><div><small>수협 차량관리 · 교육 시연</small><h1>차량 운행기록</h1></div></div><button id="settings" class="outline">지도 설정</button></div></header>
<main>
<section class="panel setup" aria-labelledby="vehicleTitle">
<div class="row"><h2 id="vehicleTitle">차량 선택</h2><label class="switch"><input type="checkbox" id="real"> 실측 GPS</label></div>
<div id="vehicles" class="vehicles"></div>
<div id="access" hidden><label for="code">참가자별 시연 코드</label><input id="code" type="password" autocomplete="off" spellcheck="false" placeholder="발급받은 코드 입력"></div>
</section>
<section class="panel ride" aria-labelledby="driveTitle">
<div class="row"><h2 id="driveTitle">운행 현황</h2><span id="mode" class="badge">가상 경로</span></div>
<div class="ride-summary">
<img id="truck" src="./vehicles/cold-01.webp" alt="선택한 탑차">
<div><span id="state" class="status">운행 대기</span><div id="metrics">00:00 · 0.00 km</div><small id="freshness">운행을 시작하면 지도에 위치가 표시됩니다.</small></div>
</div>
<div id="map" aria-label="운행 경로 지도"></div>
<div id="mapNote" class="muted"></div>
<div class="row controls"><button id="action" class="primary">운행 시작</button><label class="switch"><input type="checkbox" id="follow" checked> 차량 따라가기</label></div>
<p id="message" role="status" aria-live="polite"></p>
</section>
<section class="panel" aria-labelledby="logTitle"><div class="row"><h2 id="logTitle">운행일지</h2><button id="reload" class="outline">새로고침</button></div><ul id="records"></ul></section>
</main>
<dialog id="mapSettings">
<form id="mapForm">
<h2>지도 설정</h2>
<p>카카오 JavaScript 키를 이 기기의 브라우저에 저장합니다.</p>
<label for="mapKey">카카오 JavaScript 키</label>
<input id="mapKey" type="password" autocomplete="off" spellcheck="false" placeholder="카카오 키 붙여넣기">
<small>입력란을 비워 저장하면 OpenStreetMap을 사용합니다.</small>
<p id="settingsError" role="alert"></p>
<div class="row"><button type="button" id="cancel" class="outline">닫기</button><button class="primary">저장</button></div>
</form>
</dialog>
</body>
</html>
